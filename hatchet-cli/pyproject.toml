[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatchet-cli"
version = "1.0.0"
description = "A comprehensive command-line interface for Hatchet workflow orchestration platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hatchet CLI Contributors"}
]
keywords = ["hatchet", "cli", "workflow", "orchestration", "tasks", "background-jobs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[project.scripts]
hatchet = "hatchet_cli.main:cli"
hctl = "hatchet_cli.main:cli"

[project.urls]
Homepage = "https://github.com/hatchet-dev/hatchet"
Documentation = "https://docs.hatchet.run"
Repository = "https://github.com/hatchet-dev/hatchet"

[tool.setuptools.packages.find]
where = ["."]
include = ["hatchet_cli*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
